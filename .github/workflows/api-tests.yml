name: API Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "API Key is missing (likely a PR from a fork or unset secret). Skipping Newman execution to prevent false failures."
          else
            newman run postman/ReqRes_API_QA_Portfolio.postman_collection.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "api-key=$REQRES_API_KEY"
          fi
